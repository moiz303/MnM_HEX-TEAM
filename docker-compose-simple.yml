services:
  alice:
    image: python:3.11-slim
    container_name: mesh-alice
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - MESSENGER_USERNAME=Alice
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y gcc g++ libffi-dev libssl-dev &&
        pip install -r requirements.txt &&
        python3 run_server.py
      "
    networks:
      - mesh-net

  bob:
    image: python:3.11-slim
    container_name: mesh-bob
    working_dir: /app
    ports:
      - "8081:8080"
    environment:
      - MESSENGER_USERNAME=Bob
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y gcc g++ libffi-dev libssl-dev &&
        pip install -r requirements.txt &&
        python3 run_server.py
      "
    networks:
      - mesh-net

  charlie:
    image: python:3.11-slim
    container_name: mesh-charlie
    working_dir: /app
    ports:
      - "8082:8080"
    environment:
      - MESSENGER_USERNAME=Charlie
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y gcc g++ libffi-dev libssl-dev &&
        pip install -r requirements.txt &&
        python3 run_server.py
      "
    networks:
      - mesh-net

networks:
  mesh-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
