<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Network Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .network-container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 30px;
        }
        
        .network-canvas {
            width: 100%;
            height: 400px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }
        
        .btn.danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }
        
        .message-log {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            background: rgba(255,255,255,0.05);
        }
        
        .log-entry.success {
            border-left: 4px solid #4CAF50;
        }
        
        .log-entry.error {
            border-left: 4px solid #f44336;
        }
        
        .log-entry.info {
            border-left: 4px solid #2196F3;
        }
        
        .timestamp {
            font-size: 0.9em;
            opacity: 0.7;
            margin-right: 10px;
        }
        
        .node-info {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .pulsing {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Mesh Network Visualizer</h1>
            <p>Визуализация и мониторинг децентрализованной сети</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="nodeCount">0</div>
                <div class="stat-label">Активных узлов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="relayCount">0</div>
                <div class="stat-label">Ретрансляторов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="messageCount">0</div>
                <div class="stat-label">Сообщений в очередях</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="circuitCount">0</div>
                <div class="stat-label">Активных цепей</div>
            </div>
        </div>
        
        <div class="network-container">
            <h3>🔗 Топология сети</h3>
            <canvas id="networkCanvas" class="network-canvas"></canvas>
            <div class="node-info" id="nodeInfo"></div>
            
            <div class="controls">
                <button class="btn" onclick="updateStats()">🔄 Обновить</button>
                <button class="btn secondary" onclick="toggleAnimation()">▶️ Анимация</button>
                <button class="btn secondary" onclick="sendMessage()">📤 Отправить тест</button>
                <button class="btn danger" onclick="clearLogs()">🗑️ Очистить логи</button>
            </div>
        </div>
        
        <div class="message-log" id="messageLog">
            <h3>📋 События сети</h3>
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        class MeshVisualizer {
            constructor() {
                this.canvas = document.getElementById('networkCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.nodes = new Map();
                this.connections = [];
                this.animationRunning = false;
                this.animationFrame = 0;
                
                this.setupCanvas();
                this.startPolling();
                this.setupEventListeners();
            }
            
            setupCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                
                window.addEventListener('resize', () => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.canvas.width = rect.width;
                    this.canvas.height = rect.height;
                    this.draw();
                });
            }
            
            setupEventListeners() {
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    this.handleMouseMove(x, y, e.clientX, e.clientY);
                });
                
                this.canvas.addEventListener('mouseleave', () => {
                    document.getElementById('nodeInfo').style.display = 'none';
                });
            }
            
            handleMouseMove(x, y, clientX, clientY) {
                const nodeInfo = document.getElementById('nodeInfo');
                let hoveredNode = null;
                
                for (const [id, node] of this.nodes) {
                    const dist = Math.sqrt(Math.pow(x - node.x, 2) + Math.pow(y - node.y, 2));
                    if (dist < 20) {
                        hoveredNode = node;
                        break;
                    }
                }
                
                if (hoveredNode) {
                    nodeInfo.innerHTML = `
                        <strong>${hoveredNode.name}</strong><br>
                        ID: ${hoveredNode.id}<br>
                        Ретранслятор: ${hoveredNode.isRelay ? 'Да' : 'Нет'}<br>
                        Нагрузка: ${hoveredNode.load}%
                    `;
                    nodeInfo.style.display = 'block';
                    nodeInfo.style.left = clientX + 10 + 'px';
                    nodeInfo.style.top = clientY + 10 + 'px';
                } else {
                    nodeInfo.style.display = 'none';
                }
            }
            
            addNode(id, name, isRelay = false, load = 0) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.min(this.canvas.width, this.canvas.height) * 0.3;
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                this.nodes.set(id, {
                    id,
                    name,
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    isRelay,
                    load,
                    color: isRelay ? '#4CAF50' : '#2196F3',
                    pulsePhase: Math.random() * Math.PI * 2
                });
            }
            
            addConnection(fromId, toId, strength = 1) {
                this.connections.push({
                    from: fromId,
                    to: toId,
                    strength
                });
            }
            
            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Нарисовать соединения
                this.connections.forEach(conn => {
                    const fromNode = this.nodes.get(conn.from);
                    const toNode = this.nodes.get(conn.to);
                    
                    if (fromNode && toNode) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(fromNode.x, fromNode.y);
                        this.ctx.lineTo(toNode.x, toNode.y);
                        this.ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 * conn.strength})`;
                        this.ctx.lineWidth = 2 * conn.strength;
                        this.ctx.stroke();
                    }
                });
                
                // Нарисовать узлы
                for (const [id, node] of this.nodes) {
                    const pulse = this.animationRunning ? 
                        Math.sin(this.animationFrame * 0.05 + node.pulsePhase) * 3 : 0;
                    
                    // Внешний круг для ретрансляторов
                    if (node.isRelay) {
                        this.ctx.beginPath();
                        this.ctx.arc(node.x, node.y, 25 + pulse, 0, Math.PI * 2);
                        this.ctx.fillStyle = 'rgba(76, 175, 80, 0.2)';
                        this.ctx.fill();
                    }
                    
                    // Основной круг узла
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, 15 + pulse, 0, Math.PI * 2);
                    this.ctx.fillStyle = node.color;
                    this.ctx.fill();
                    this.ctx.strokeStyle = 'white';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    
                    // Имя узла
                    this.ctx.fillStyle = 'white';
                    this.ctx.font = '12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(node.name, node.x, node.y - 25);
                }
            }
            
            animate() {
                if (!this.animationRunning) return;
                
                this.animationFrame++;
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
            
            async fetchStats() {
                try {
                    const response = await fetch('/api/mesh/stats');
                    const stats = await response.json();
                    this.updateUI(stats);
                    return stats;
                } catch (error) {
                    this.addLog('Ошибка получения статистики: ' + error.message, 'error');
                }
            }
            
            updateUI(stats) {
                document.getElementById('nodeCount').textContent = stats.total_peers || 0;
                document.getElementById('relayCount').textContent = stats.known_relays || 0;
                document.getElementById('messageCount').textContent = stats.queued_messages || 0;
                document.getElementById('circuitCount').textContent = stats.active_circuits || 0;
                
                // Обновить узлы (симуляция)
                if (stats.device_id) {
                    this.addNode(stats.device_id, 'Вы', true, stats.current_load || 0);
                }
                
                // Добавить несколько симулированных узлов для демонстрации
                if (this.nodes.size < 2) {
                    this.addNode('node1', 'Alice', true, 20);
                    this.addNode('node2', 'Bob', false, 0);
                    this.addNode('node3', 'Charlie', true, 45);
                    
                    this.addConnection('node1', 'node2', 0.8);
                    this.addConnection('node1', 'node3', 0.6);
                    this.addConnection('node2', 'node3', 0.4);
                }
                
                this.draw();
            }
            
            addLog(message, type = 'info') {
                const logContent = document.getElementById('logContent');
                const timestamp = new Date().toLocaleTimeString();
                
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.innerHTML = `<span class="timestamp">${timestamp}</span>${message}`;
                
                logContent.insertBefore(entry, logContent.firstChild);
                
                // Ограничить количество записей
                while (logContent.children.length > 50) {
                    logContent.removeChild(logContent.lastChild);
                }
            }
            
            startPolling() {
                this.fetchStats();
                setInterval(() => this.fetchStats(), 5000);
            }
        }
        
        // Глобальные функции
        let visualizer;
        
        function updateStats() {
            visualizer.fetchStats();
            visualizer.addLog('Статистика обновлена', 'success');
        }
        
        function toggleAnimation() {
            visualizer.animationRunning = !visualizer.animationRunning;
            if (visualizer.animationRunning) {
                visualizer.animate();
                visualizer.addLog('Анимация включена', 'info');
            } else {
                visualizer.addLog('Анимация выключена', 'info');
            }
        }
        
        function sendMessage() {
            visualizer.addLog('Тестовое сообщение отправлено через mesh-сеть', 'success');
        }
        
        function clearLogs() {
            document.getElementById('logContent').innerHTML = '';
            visualizer.addLog('Логи очищены', 'info');
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            visualizer = new MeshVisualizer();
            visualizer.addLog('Mesh Network Visualizer запущен', 'success');
            visualizer.addLog('Ожидание данных от сервера...', 'info');
        });
    </script>
</body>
</html>
