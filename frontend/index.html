<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGram</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="logo">SGram</h2>
                <div class="current-username" id="current-user-name">Loading...</div>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск контактов..." class="form-control">
            </div>

            <div id="peers-list" class="peers-list"></div>
        </aside>

        <main class="chat-container">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="user-details">
                        <h3 id="header-name">Выберите чат</h3>
                        <p id="header-status">Выберите контакт для начала общения</p>
                    </div>
                </div>
            </div>

            <div id="messages-area" class="messages-area">
                <div class="empty-state">
                    <svg width="100" height="100" viewBox="0 0 100 100" fill="currentColor">
                        <path d="M50 10c-22.1 0-40 17.9-40 40s17.9 40 40 40 40-17.9 40-40-17.9-40-40-40zm0 75c-19.3 0-35-15.7-35-35s15.7-35 35-35 35 15.7 35 35-15.7 35-35 35z"/>
                        <circle cx="37" cy="42" r="4"/>
                        <circle cx="63" cy="42" r="4"/>
                        <path d="M50 70c-8.8 0-16-7.2-16-16h5c0 6.1 4.9 11 11 11s11-4.9 11-11h5c0 8.8-7.2 16-16 16z"/>
                    </svg>
                    <p>Выберите контакт для начала общения</p>
                </div>
            </div>

            <div id="file-preview" class="file-preview hidden"></div>

            <div id="message-input-wrapper" class="message-input-wrapper" style="display: none;">
                <button id="attach-btn" class="attach-btn" title="Прикрепить файл">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <input type="file" id="file-input" style="display: none;" multiple>
                <input type="text" id="message-input" placeholder="Введите сообщение..." />
                <button id="send-btn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <div id="notification-container" class="notification-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
