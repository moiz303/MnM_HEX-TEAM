<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure P2P Messenger - безопасный мессенджер с шифрованием">
    <meta name="theme-color" content="#00d9ff">
    <title>SGram</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300d9ff'><circle cx='12' cy='12' r='10' stroke='%2300d9ff' stroke-width='2' fill='none'/><path d='M12 2L12 12L20 20' stroke='%2300d9ff' stroke-width='2' stroke-linecap='round'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300d9ff'><circle cx='12' cy='12' r='10' stroke='%2300d9ff' stroke-width='2' fill='none'/><path d='M12 2L12 12L20 20' stroke='%2300d9ff' stroke-width='2' stroke-linecap='round'/></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
                        <circle cx="24" cy="24" r="20" stroke="url(#gradient1)" stroke-width="3"/>
                        <path d="M24 8L24 24L35 35" stroke="url(#gradient1)" stroke-width="3" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00D9FF"/>
                                <stop offset="100%" style="stop-color:#00FF94"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>SGram</span>
                </div>
            </div>
            
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                    <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" placeholder="Поиск по имени..." id="search-input">
            </div>
            
            <div class="peers-list" id="peers-list"></div>
        </aside>
        
        <main class="chat-container">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="avatar" id="header-avatar">
                        <span>?</span>
                        <div class="status-indicator"></div>
                    </div>
                    <div class="user-details">
                        <h3 id="header-name">Выберите чат</h3>
                        <p id="header-status">—</p>
                    </div>
                </div>
                
                <div class="chat-actions">
                    <button class="action-btn" id="delete-chat-btn" title="Удалить чат">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M3 6H5H21M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="messages-area" id="messages-area">
                <div class="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
                        <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <p>Выберите контакт для начала общения</p>
                </div>
            </div>
            
            <div class="file-preview hidden" id="file-preview"></div>
            
            <div class="message-input-wrapper">
                <input type="file" id="file-input" multiple hidden>
                <button class="attach-btn" id="attach-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M21.44 11.05L12.25 20.24C11.1242 21.3658 9.59723 21.9983 8.005 21.9983C6.41277 21.9983 4.88584 21.3658 3.76 20.24C2.63416 19.1142 2.00166 17.5872 2.00166 15.995C2.00166 14.4028 2.63416 12.8758 3.76 11.75L12.33 3.18C13.0806 2.42944 14.0991 2.00562 15.16 2.00562C16.2209 2.00562 17.2394 2.42944 17.99 3.18C18.7406 3.93056 19.1644 4.94913 19.1644 6.01C19.1644 7.07087 18.7406 8.08944 17.99 8.84L9.41 17.41C9.03472 17.7853 8.52544 17.9971 7.995 17.9971C7.46456 17.9971 6.95528 17.7853 6.58 17.41C6.20472 17.0347 5.99292 16.5254 5.99292 15.995C5.99292 15.4646 6.20472 14.9553 6.58 14.58L14.07 7.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <input type="text" id="message-input" placeholder="Введите сообщение...">
                <button class="send-btn" id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>
    
    <!-- Система уведомлений -->
    <div id="notification-container" class="notification-container"></div>
    
    <script src="js/app.js"></script>
</body>
</html>
