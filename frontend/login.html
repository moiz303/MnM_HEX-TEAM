<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Secure Messenger</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--color-text);
        }
        
        .login-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            margin-bottom: 20px;
            transition: all var(--duration-normal) var(--ease-standard);
        }
        
        .login-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: var(--focus-ring);
        }
        
        .login-button {
            width: 100%;
            padding: 12px 24px;
            background: var(--gradient-primary);
            color: var(--color-btn-primary-text);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-standard);
        }
        
        .login-button:hover {
            background: var(--color-primary-hover);
        }
        
        .login-info {
            margin-top: 20px;
            padding: 15px;
            background: var(--color-bg-1);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">🔐 Secure P2P Messenger</h1>
        
        <form id="loginForm">
            <input 
                type="text" 
                id="username" 
                class="login-input" 
                placeholder="Введите ваше имя" 
                required 
                maxlength="20"
                pattern="[A-Za-zА-Яа-я0-9_]+"
                title="Имя может содержать буквы, цифры и подчеркивания"
            >
            
            <button type="submit" class="login-button">
                Войти в чат
            </button>
        </form>
        
        <div class="login-info">
            <strong>ℹ️ Подсказка:</strong><br>
            • Используйте уникальное имя (alice, bob, viktor)<br>
            • Имя будет видно другим пользователям<br>
            • Максимальная длина: 20 символов
        </div>
    </div>

    <script>
        // Auto-save username from server if already set
        fetch('/api/auto_save_username')
            .then(response => response.json())
            .then(data => {
                if (data.success && data.username !== 'user') {
                    localStorage.setItem('messenger_username', data.username);
                    document.getElementById('username').value = data.username;
                }
            })
            .catch(error => {
                console.log('Could not auto-fetch username');
            });
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            if (!username) {
                alert('Пожалуйста, введите имя');
                return;
            }
            
            try {
                // Сохраняем имя в localStorage
                localStorage.setItem('messenger_username', username);
                
                // Устанавливаем имя на сервере
                const response = await fetch('/api/set_username', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert(`✅ ${result.message}`);
                    // Перенаправляем на главную страницу через 1 секунду
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    alert(`❌ Ошибка: ${result.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Произошла ошибка. Попробуйте снова.');
            }
        });
        
        // Проверяем, есть ли сохраненное имя
        const savedUsername = localStorage.getItem('messenger_username');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
        }
    </script>
</body>
</html>
